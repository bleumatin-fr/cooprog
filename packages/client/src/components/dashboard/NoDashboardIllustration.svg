<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Dashboard background -->
    <rect x="20" y="20" width="160" height="160" rx="8" fill="#F5F5F5" stroke="#E0E0E0"
        stroke-width="2" />

    <!-- Dashboard elements -->
    <rect x="40" y="40" width="60" height="40" rx="4" fill="#E3F2FD" stroke="#90CAF9"
        stroke-width="2" />
    <rect x="110" y="40" width="60" height="40" rx="4" fill="#E3F2FD" stroke="#90CAF9"
        stroke-width="2" />
    <rect x="40" y="90" width="130" height="40" rx="4" fill="#E3F2FD" stroke="#90CAF9"
        stroke-width="2" />
    <rect x="40" y="140" width="130" height="20" rx="4" fill="#E3F2FD" stroke="#90CAF9"
        stroke-width="2" />

    <!-- No access symbol -->
    <circle cx="100" cy="100" r="50" fill="white" stroke="#FF5252" stroke-width="4" />
    <path d="M70 100 L130 100" stroke="#FF5252" stroke-width="4" stroke-linecap="round" />
</svg> 