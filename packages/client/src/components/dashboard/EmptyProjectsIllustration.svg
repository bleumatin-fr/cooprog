<?xml version="1.0" encoding="UTF-8"?>
<svg width="240" height="240" viewBox="0 0 240 240" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Background circle -->
    <circle cx="120" cy="120" r="100" fill="#F5F5F5" />

    <!-- Project board -->
    <rect x="60" y="70" width="120" height="100" rx="8" fill="white" stroke="#E0E0E0"
        stroke-width="2" />

    <!-- Empty list lines -->
    <line x1="80" y1="90" x2="160" y2="90" stroke="#E0E0E0" stroke-width="2" stroke-linecap="round" />
    <line x1="80" y1="110" x2="160" y2="110" stroke="#E0E0E0" stroke-width="2"
        stroke-linecap="round" />
    <line x1="80" y1="130" x2="160" y2="130" stroke="#E0E0E0" stroke-width="2"
        stroke-linecap="round" />

    <!-- Plus icon -->
    <circle cx="120" cy="40" r="20" fill="#1976D2" fill-opacity="0.1" />
    <line x1="110" y1="40" x2="130" y2="40" stroke="#1976D2" stroke-width="2" stroke-linecap="round" />
    <line x1="120" y1="30" x2="120" y2="50" stroke="#1976D2" stroke-width="2" stroke-linecap="round" />

    <!-- Decorative elements -->
    <circle cx="40" cy="160" r="15" fill="#1976D2" fill-opacity="0.1" />
    <circle cx="200" cy="160" r="15" fill="#1976D2" fill-opacity="0.1" />
    <circle cx="120" cy="180" r="10" fill="#1976D2" fill-opacity="0.1" />
</svg> 