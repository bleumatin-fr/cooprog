services:
  web:
    image: nginx
    volumes:
      - ./.docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - 3000:80
    links:
      - server
      - client
      - admin

  core:
    build:
      context: ./.docker/node-with-corepack
    working_dir: /app/packages/core
    command: yarn run start
    environment:
      - NODE_ENV=development
    volumes:
      - .:/app
      - core_node_modules:/app/packages/core/node_modules
      - node_modules:/app/node_modules

  admin:
    build:
      context: ./.docker/node-with-corepack
    working_dir: /app/packages/admin
    command: yarn run start
    environment:
      - NODE_ENV=development
      - PORT=3000
      - VITE_APP_API_URL=http://localhost:3000/admin/api
      - VITE_APP_AUTH_API_URL=http://localhost:3000/api/authentication
    volumes:
      - .:/app
      - admin_node_modules:/app/packages/admin/node_modules
      - node_modules:/app/node_modules
    links:
      - server

  client:
    build:
      context: ./.docker/node-with-corepack
    working_dir: /app/packages/client
    command: yarn run start
    environment:
      - NODE_ENV=development
      - PORT=3000
      - API_URL=http://server:3000/api
      - NEXT_PUBLIC_API_URL=http://localhost:3000/api
    volumes:
      - .:/app
      - client_node_modules:/app/packages/client/node_modules
      - node_modules:/app/node_modules
    ports:
      - 13002:13002
    links:
      - server

  server:
    build:
      context: ./.docker/node-with-corepack
    working_dir: /app/packages/server
    command: yarn run start
    environment:
      - NODE_ENV=development
      - PORT=3000
      - MONGO_URL=mongodb://root:r00tp4skalF10@mongo:27017/cooprogv1?authSource=admin
      - MAIL_URL=smtp://maildev:1025
      - MAIL_FROM=no-reply@cooprog.eu
      - MAIL_TO=contact@cooprog.eu
      - WHITELISTED_DOMAINS=http://localhost:3000
      - FRONTEND_URL=http://localhost:3000
      - ADMIN_URL=http://localhost:4000/admin
      - UPLOAD_PATH=/app/packages/server/uploads
    volumes:
      - .:/app
      - server_node_modules:/app/packages/server/node_modules
      - client_node_modules:/app/packages/client/node_modules
      - admin_node_modules:/app/packages/admin/node_modules
      - core_node_modules:/app/packages/core/node_modules
      - node_modules:/app/node_modules
    ports:
      - 13001:13001
    depends_on:
      mongo:
        condition: service_healthy
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
    links:
      - mongo
      - maildev

  mongo:
    image: mongo:latest
    command: mongod --quiet --storageEngine=wiredTiger --logpath /dev/null
    volumes:
      - ./.docker/mongo/data:/data/db
      - ./.docker/mongo/backup:/data/backup
    ports:
      - 27017:27017
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=r00tp4skalF10
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh mongodb://root:r00tp4skalF10@localhost:27017/admin --quiet
      interval: 10s
      timeout: 5s
      retries: 3

  maildev:
    image: maildev/maildev

volumes:
  admin_node_modules:
  client_node_modules:
  server_node_modules:
  core_node_modules:
  node_modules:
